name: App Store sources (weekly)
on:
  schedule:
    - cron: "0 20 * * 0"   # Sunday 20:00 UTC, before the Monday 00:00 UTC article routine
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyjwt cryptography
      - run: python tools/asc_sources.py
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
      - run: |
          git config user.name "asc-sources-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/search-terms
          git diff --cached --quiet || (git commit -m "App Store sources: weekly export" && git push)
